services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-wedding}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-wedding}
      POSTGRES_DB: ${POSTGRES_DB:-wedding}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-wedding}']
      interval: 5s
      timeout: 5s
      retries: 10

  migrate:
    build: .
    command: ['node_modules/.bin/tsx', 'src/lib/server/db/migrate.ts']
    env_file: .env
    depends_on:
      postgres:
        condition: service_healthy
    restart: 'no'

  app:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      PORT: 3000
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ['CMD-SHELL', 'wget -qO- http://localhost:3000/api/health | grep -q ''"status":"ok"''']
      interval: 15s
      timeout: 5s
      retries: 5

  worker:
    build: .
    command: ['node_modules/.bin/tsx', 'worker/index.ts']
    restart: unless-stopped
    env_file: .env
    depends_on:
      migrate:
        condition: service_completed_successfully

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - '80:80'
      - '443:443'
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    environment:
      SITE_DOMAIN: ${SITE_DOMAIN}
    depends_on:
      - app

volumes:
  pgdata:
  caddy_data:
  caddy_config:
