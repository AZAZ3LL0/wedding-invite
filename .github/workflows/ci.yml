name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  DATABASE_URL: postgres://wedding:wedding@localhost:5432/wedding
  ORIGIN: http://localhost:4173
  WEDDING_DATE: '2027-06-12T15:00:00+03:00'
  RSVP_LOCK_AT: '2027-06-09T23:59:00+03:00'
  USE_FAKE_TELEGRAM: 'true'

jobs:
  verify:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: wedding
          POSTGRES_PASSWORD: wedding
          POSTGRES_DB: wedding
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U wedding"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm check

      - name: Apply migrations to an empty database
        run: pnpm db:migrate

      - name: Check the schema matches the migrations
        timeout-minutes: 2
        run: pnpm db:generate --name ci_drift_check && git diff --exit-code drizzle

      - name: Unit tests
        run: pnpm test

      - name: Integration tests
        run: pnpm test:integration

      - name: Worker picks the demo job up
        timeout-minutes: 2
        run: |
          timeout 45s pnpm worker > worker.log 2>&1 || true
          cat worker.log
          grep -q 'worker ready' worker.log
          grep -q 'demo.ping. worker started' worker.log

      - name: Build
        run: pnpm build

      - name: JavaScript budget
        run: pnpm perf:budget

      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium

      - name: Seed the database for end to end tests
        run: pnpm db:seed

      - name: End to end tests
        run: pnpm test:e2e

      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

      # Field budget from tech.md section 1: LCP under 2 s on 4G, CLS under 0.05.
      # Lighthouse runs its default mobile emulation with simulated slow 4G, which is
      # the condition that number was written for. Two invites, so a heavy family page
      # cannot hide behind a light one.
      - name: Lighthouse budget
        uses: treosh/lighthouse-ci-action@v12
        with:
          configPath: ./lighthouserc.json
          uploadArtifacts: false

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: lighthouse-report
          path: lighthouse-report/
          retention-days: 7
